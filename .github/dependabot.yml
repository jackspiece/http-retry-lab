# Keeps the SHA-pinned actions in .github/workflows and the pinned tools in
# requirements-dev.txt current. The cooldown skips releases younger than a week.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
